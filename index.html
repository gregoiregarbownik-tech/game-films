<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>🎬 Jeu des Films</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  font-family: Poppins, sans-serif;
  background: #0f172a;
  color: white;
  text-align: center;
  padding: 20px;
}
h1 { color: #facc15; }
input, button, select {
  padding: 10px;
  margin: 5px;
  border-radius: 8px;
  border: none;
}
button {
  background: #facc15;
  font-weight: bold;
  cursor: pointer;
}
#scoreBox {
  display: flex;
  justify-content: center;
  gap: 15px;
}
.score {
  background: #1e293b;
  padding: 10px 20px;
  border-radius: 10px;
}
#filmGrid {
  margin-top: 20px;
  display: grid;
  grid-template-columns: repeat(auto-fill, 120px);
  justify-content: center;
  gap: 15px;
}
.card {
  background: #1e293b;
  border-radius: 10px;
  padding: 5px;
}
.card img {
  width: 100px;
  height: 150px;
  border-radius: 6px;
}
</style>
</head>

<body>

<h1>🎬 Jeu des Films</h1>

<div>
Mode :
<select id="mode">
  <option value="solo">Solo</option>
  <option value="multi">Multijoueur</option>
</select>
</div>

<div>
⏱ Temps (minutes) :
<input type="number" id="timerInput" value="5" min="1">

🔤 Lettre :
<select id="lettreInput">
  <option value="">Toutes</option>
  <option value="random">Aléatoire</option>
</select>

🎭 Genre :
<select id="genreInput">
  <option value="">Tous</option>
  <option value="16">Animation</option>
  <option value="28">Action</option>
  <option value="35">Comédie</option>
  <option value="18">Drame</option>
</select>

<button onclick="demarrer()">Démarrer</button>
</div>

<div>
<input id="filmInput" placeholder="Titre du film" disabled>
<button onclick="valider()" disabled>Valider</button>
</div>

<p id="lettreAff"></p>
<p id="timer">⏳ --:--</p>

<div id="scoreBox"></div>
<div id="filmGrid"></div>

<script>
const tmdbKey = "00f966a09a2db9feeb0ceedc1c33e89d";

let joueurs = [];
let joueurActuel = 0;
let films = [];
let lettreActuelle = "";
let temps = 0;
let interval = null;

const filmInput = document.getElementById("filmInput");
const validerBtn = document.querySelector("button[onclick='valider()']");

// alphabet
const selectLettre = document.getElementById("lettreInput");
for(let i=65;i<=90;i++){
  const l = String.fromCharCode(i);
  let o = document.createElement("option");
  o.value = l.toLowerCase();
  o.textContent = l;
  selectLettre.appendChild(o);
}

function normaliser(t){
  return t.normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .replace(/^(l['’]|le |la |les |un |une |the )/,"")
    .trim();
}

function lettreRandom(){
  return "abcdefghijklmnopqrstuvwxyz"[Math.floor(Math.random()*26)];
}

function demarrer(){
  films = [];
  joueurActuel = 0;
  document.getElementById("filmGrid").innerHTML = "";
  document.getElementById("scoreBox").innerHTML = "";

  joueurs = document.getElementById("mode").value === "multi"
    ? [{nom:"Joueur 1",score:0},{nom:"Joueur 2",score:0}]
    : [{nom:"Joueur",score:0}];

  joueurs.forEach(j=>{
    const d=document.createElement("div");
    d.className="score";
    d.id=j.nom;
    d.textContent=`${j.nom}: 0`;
    document.getElementById("scoreBox").appendChild(d);
  });

  filmInput.disabled=false;
  validerBtn.disabled=false;

  temps = document.getElementById("timerInput").value * 60;
  clearInterval(interval);
  interval=setInterval(updateTimer,1000);
  updateTimer();

  if(selectLettre.value==="random"){
    lettreActuelle = lettreRandom();
  } else {
    lettreActuelle = selectLettre.value;
  }
  afficherLettre();
}

function afficherLettre(){
  document.getElementById("lettreAff").textContent =
    lettreActuelle ? "Lettre : " + lettreActuelle.toUpperCase() : "";
}

function updateTimer(){
  if(temps<=0){
    clearInterval(interval);
    fin();
    return;
  }
  let m=Math.floor(temps/60), s=temps%60;
  document.getElementById("timer").textContent =
    `⏳ ${m}:${s.toString().padStart(2,"0")}`;
  temps--;
}

async function valider(){
  const titreUser = filmInput.value.trim();
  if(!titreUser) return;

  const normUser = normaliser(titreUser);
  if(films.includes(normUser)){
    alert("Déjà trouvé");
    return;
  }

  const search = await fetch(
    `https://api.themoviedb.org/3/search/movie?api_key=${tmdbKey}&query=${encodeURIComponent(titreUser)}`
  );
  const data = await search.json();

  let film = data.results?.find(f =>
    normaliser(f.title)===normUser ||
    normaliser(f.original_title)===normUser
  );

  if(!film){
    alert("Titre exact requis");
    return;
  }

  // 🔥 VÉRIFICATION GENRE CORRIGÉE
  const genreChoisi = document.getElementById("genreInput").value;
  if(genreChoisi){
    const details = await fetch(
      `https://api.themoviedb.org/3/movie/${film.id}?api_key=${tmdbKey}`
    ).then(r=>r.json());

    const genres = details.genres.map(g=>g.id);
    if(!genres.includes(parseInt(genreChoisi))){
      alert("Mauvais genre");
      return;
    }
  }

  // lettre
  if(lettreActuelle && !normUser.startsWith(lettreActuelle)){
    alert("Mauvaise lettre");
    return;
  }

  films.push(normUser);

  joueurs[joueurActuel].score++;
  document.getElementById(joueurs[joueurActuel].nom).textContent =
    `${joueurs[joueurActuel].nom}: ${joueurs[joueurActuel].score}`;

  const card=document.createElement("div");
  card.className="card";
  card.innerHTML=`
    <img src="https://image.tmdb.org/t/p/w200${film.poster_path}">
    <div>${film.title}</div>`;
  document.getElementById("filmGrid").prepend(card);

  filmInput.value="";

  joueurActuel = (joueurActuel+1)%joueurs.length;

  if(selectLettre.value==="random"){
    lettreActuelle = lettreRandom();
    afficherLettre();
  }
}

function fin(){
  const gagnant = joueurs.reduce((a,b)=>a.score>b.score?a:b);
  alert("Gagnant : "+gagnant.nom+" ("+gagnant.score+")");
}
</script>

</body>
</html>
