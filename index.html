<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>🎬 Jeu des Films Amélioré</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg,#1a1a2e,#162447); color:#fff; text-align:center; margin:0; padding:20px;}
h1 { color:#ffcc00; }
input, button, select { padding:10px; margin:5px; font-size:16px; border-radius:8px; border:none;}
button { background:#ffcc00; font-weight:600; cursor:pointer;}
button:hover { background:#e6b800;}
#scoreBox { display:flex; justify-content:center; gap:15px; margin:10px;}
.scoreJoueur { background:#222; padding:10px 20px; border-radius:10px; transition: transform 0.3s;}
#filmGrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:15px; margin-top:20px;}
.filmCard { background:#222; border-radius:10px; padding:5px; opacity:0; transform: scale(0.5);}
.filmCard img { width:100px; height:150px; border-radius:6px;}
#joueurActif { font-size:20px; color:#ffcc00; margin-top:10px; transition: color 0.3s;}
@keyframes pop {0%{transform:scale(0.5);opacity:0;}50%{transform:scale(1.2);opacity:1;}100%{transform:scale(1);opacity:1;}}
.filmCard.pop { animation: pop 0.4s ease forwards; }
@keyframes scorePulse {0%{transform:scale(1);}50%{transform:scale(1.3);}100%{transform:scale(1);}}
.scoreJoueur.point { animation: scorePulse 0.4s ease forwards; }
.activePlayer { color:#ff6600; }
</style>
</head>
<body>

<h1>🎬 Jeu des Films Amélioré</h1>

<div>
  Mode : 
  <select id="modeJeu">
    <option value="solo">Solo</option>
    <option value="multi">Multijoueur</option>
  </select>
</div>

<div id="multiConfig" style="display:none;">
  Nombre de joueurs : <input type="number" id="nbJoueurs" value="2" min="2" max="4">
  <button onclick="configurerJoueurs()">Valider</button>
</div>

<div id="joueursInput" style="display:none;"></div>

<div>
  ⏱ Durée (minutes) : <input type="number" id="timerInput" value="5" min="1" max="180">
  🔤 Mode lettre : 
  <select id="lettreInput">
    <option value="">Tous les films</option>
    <option value="random">Lettre aléatoire</option>
  </select>
  🎭 Genre : 
  <select id="genreInput">
    <option value="">Tous genres</option>
    <option value="28">Action</option>
    <option value="35">Comédie</option>
    <option value="16">Animation</option>
    <option value="18">Drame</option>
  </select>
  <button onclick="demarrerJeu()">Démarrer</button>
</div>

<div>
  <input type="text" id="filmInput" placeholder="Titre exact du film" disabled>
  <button onclick="validerFilm()" disabled>Valider</button>
</div>

<div id="joueurActif"></div>
<div id="scoreBox"></div>

<p>⏳ Temps restant : <span id="temps">--:--:--</span></p>

<div id="filmGrid"></div>

<script>
// ===== LETTRES A-Z =====
const select = document.getElementById("lettreInput");
for(let i=65;i<=90;i++){
  const l = String.fromCharCode(i);
  const opt = document.createElement("option");
  opt.value = l.toLowerCase();
  opt.textContent = `Films commençant par ${l}`;
  select.appendChild(opt);
}

// ===== VARIABLES =====
let temps = 0;
let timer = null;
let filmsTrouves = [];
let joueurs = [];
let joueurActuel = 0;
let currentLetter = "";
let selectedGenreId = "";

const tmdbKey="00f966a09a2db9feeb0ceedc1c33e89d";
const omdbKey="10a96ebb";

// ===== UTIL =====
function normaliser(txt){ return txt.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();}
function titreSansDeterminant(titre){ return titre.toLowerCase().replace(/^(l['’]|le |la |les |un |une |the )/i,"").trim();}
function choisirLettreAleatoire(){ const lettres="abcdefghijklmnopqrstuvwxyz"; return lettres[Math.floor(Math.random()*lettres.length)];}

// ===== MULTIJOUEUR =====
document.getElementById("modeJeu").addEventListener("change", e => {
  if(e.target.value=="multi") { document.getElementById("multiConfig").style.display="block"; } 
  else { document.getElementById("multiConfig").style.display="none"; document.getElementById("joueursInput").style.display="none"; }
});

function configurerJoueurs(){
  const nb = parseInt(document.getElementById("nbJoueurs").value);
  const div = document.getElementById("joueursInput");
  div.innerHTML="";
  for(let i=0;i<nb;i++){
    const input=document.createElement("input");
    input.placeholder="Nom joueur "+(i+1);
    input.id="joueur"+i;
    div.appendChild(input); div.appendChild(document.createElement("br"));
  }
  const btn=document.createElement("button"); btn.textContent="Valider les noms";
  btn.onclick=()=>{
    joueurs=[]; for(let i=0;i<nb;i++){
      const nom=document.getElementById("joueur"+i).value.trim()||("Joueur"+(i+1));
      joueurs.push({nom:nom,score:0});
    }
    div.style.display="none"; majScoreJoueurs();
    alert("Prêt ! Tour de "+joueurs[0].nom);
  }
  div.appendChild(btn); div.style.display="block";
}

function majScoreJoueurs(){
  const box=document.getElementById("scoreBox"); box.innerHTML="";
  joueurs.forEach((j,i)=>{
    const div=document.createElement("div"); div.className="scoreJoueur"; div.id="scoreJ"+i;
    div.textContent=`${j.nom} : ${j.score}`; box.appendChild(div);
  });
}

function majJoueurActif(){
  if(document.getElementById("modeJeu").value=="multi"){
    const elem = document.getElementById("joueurActif");
    elem.textContent="🎮 Joueur actuel : "+joueurs[joueurActuel].nom;
    elem.classList.remove("activePlayer"); void elem.offsetWidth; elem.classList.add("activePlayer");
    setTimeout(()=>elem.classList.remove("activePlayer"),300);
  } else { document.getElementById("joueurActif").textContent=""; }
}

// ===== JEU =====
function demarrerJeu(){
  filmsTrouves=[]; joueurActuel=0;
  selectedGenreId=document.getElementById("genreInput").value;
  const duree=parseInt(document.getElementById("timerInput").value); temps=duree*60;
  document.getElementById("filmInput").disabled=false;
  document.querySelector("button[onclick='validerFilm()']").disabled=false;
  document.getElementById("filmGrid").innerHTML="";
  if(timer) clearInterval(timer); timer=setInterval(updateTimer,1000); updateTimer();

  // Mode lettre aléatoire initial
  if(document.getElementById("lettreInput").value=="random"){ 
    currentLetter = choisirLettreAleatoire(); 
    alert("Nouvelle lettre : "+currentLetter.toUpperCase()); 
  } else { currentLetter = document.getElementById("lettreInput").value; }

  majJoueurActif();
  majScoreJoueurs();
}

function updateTimer(){ if(temps<=0){ clearInterval(timer); finPartie(); return; }
  let h=Math.floor(temps/3600), m=Math.floor((temps%3600)/60), s=temps%60;
  document.getElementById("temps").textContent=`${h.toString().padStart(2,"0")}:${m.toString().padStart(2,"0")}:${s.toString().padStart(2,"0")}`; temps--;
}

function finPartie(){
  let gagnant = joueurs.reduce((a,b)=>a.score>=b.score?a:b);
  alert(`⏰ Temps écoulé ! Gagnant : ${gagnant.nom} avec ${gagnant.score} films`);
}

// ===== VALIDER FILM =====
async function validerFilm(){
  const input=document.getElementById("filmInput"); const titre=input.value.trim(); if(!titre) return;
  const titreNorm=normaliser(titreSansDeterminant(titre));
  if(filmsTrouves.includes(titreNorm)){ alert("Film déjà trouvé !"); return; }

  // Rechercher film via TMDB
  const res=await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${tmdbKey}&query=${encodeURIComponent(titre)}&language=fr-FR`);
  const data=await res.json(); 
  let film=data.results?.find(f=>normaliser(titreSansDeterminant(f.title))===titreNorm);

  if(!film){
    const res2=await fetch(`https://www.omdbapi.com/?t=${encodeURIComponent(titre)}&apikey=${omdbKey}`);
    const data2=await res2.json();
    if(data2.Response==="True" && normaliser(titreSansDeterminant(data2.Title))===titreNorm){
      film={title:data2.Title,poster_path:data2.Poster, genre_ids:[]};
    }
  }

  if(!film){ alert("❌ Titre exact requis !"); return; }

  // Vérification lettre
  if(currentLetter && !titreNorm.startsWith(currentLetter)){ alert("❌ Mauvaise lettre"); return; }

  // Vérification genre
  if(selectedGenreId && (!film.genre_ids || !film.genre_ids.includes(parseInt(selectedGenreId)))){ 
    alert("❌ Film hors genre choisi !"); return; 
  }

  filmsTrouves.push(titreNorm);

  // Score joueur actif
  const scoreDiv=document.getElementById("scoreJ"+joueurActuel);
  joueurs[joueurActuel].score++;
  scoreDiv.textContent=`${joueurs[joueurActuel].nom} : ${joueurs[joueurActuel].score}`;
  scoreDiv.classList.remove("point"); void scoreDiv.offsetWidth; scoreDiv.classList.add("point");

  // Film card
  const card=document.createElement("div"); card.className="filmCard";
  document.getElementById("filmGrid").prepend(card); void card.offsetWidth; card.classList.add("pop");
  const img=document.createElement("img");
  img.src=film.poster_path?.startsWith("http")?film.poster_path:`https://image.tmdb.org/t/p/w200${film.poster_path}`;
  card.appendChild(img);
  const titleDiv=document.createElement("div"); titleDiv.textContent=film.title; card.appendChild(titleDiv);

  input.value="";

  // Prochain tour
  joueurActuel = (joueurActuel + 1) % joueurs.length;
  majJoueurActif();

  // Nouvelle lettre aléatoire si mode random
  if(document.getElementById("lettreInput").value=="random"){ 
    currentLetter = choisirLettreAleatoire(); 
    alert("Nouvelle lettre : "+currentLetter.toUpperCase()); 
  }
}

document.getElementById("filmInput").addEventListener("keydown",e=>{ if(e.key==="Enter") validerFilm(); });
</script>
</body>
</html>
