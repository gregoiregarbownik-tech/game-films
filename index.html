<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>🎬 Jeu des Films</title>
<style>
body{font-family:Arial;background:#111;color:white;text-align:center;margin:0;padding:0;}
input,select,button{padding:8px;margin:5px;border-radius:4px;border:none;}
#films{max-height:350px;overflow:auto;padding:10px;display:flex;flex-wrap:wrap;justify-content:center;}
.film-card{background:#222;border:1px solid #555;border-radius:8px;width:120px;margin:5px;padding:5px;transition: transform 0.3s, background 0.3s;}
.film-card img{width:100%;border-radius:4px;}
.film-card h4{font-size:14px;margin:5px 0 0 0;}
.film-card.new{transform: scale(1.1);background:#333;}
#multiConfig{border:1px solid #555;padding:10px;margin:10px;text-align:left;}
.joueurActif{font-weight:bold;color:#0f0;}
#activeLetter{font-size:20px;margin:5px;}
</style>
</head>
<body>

<h1>🎬 Jeu des Films GOLD</h1>

<label>Mode :</label>
<select id="mode">
  <option value="solo">Solo</option>
  <option value="multi">Multijoueur</option>
</select>
<br>

<label>Temps (minutes) :</label>
<input type="number" id="time" value="10" min="1">
<br>

<label>Mode lettre :</label>
<select id="letter">
  <option value="">Fixe</option>
  <option value="random">Aléatoire dynamique</option>
</select>
<br>

<label>Genre :</label>
<select id="genre">
  <option value="">Tous</option>
</select>

<div id="multiConfig" style="display:none;">
  <h3>Multijoueur</h3>
  <label>Nombre de joueurs :</label>
  <select id="nbJoueurs">
    <option value="2">2</option>
    <option value="3">3</option>
    <option value="4">4</option>
  </select>
  <div id="pseudos"></div>
</div>

<br>
<button id="startBtn">▶️ Démarrer</button>

<hr>

<div id="game" style="display:none;">
  <h2 id="turn"></h2>
  <h3 id="timer"></h3>
  <div id="activeLetter"></div>

  <input id="inputFilm" placeholder="Titre du film">
  <button id="validateBtn">Valider</button>

  <h3 id="scores"></h3>
  <div id="films"></div>
</div>

<script>
window.addEventListener("DOMContentLoaded", ()=>{

const tmdbKey="00f966a09a2db9feeb0ceedc1c33e89d";
const determinants=["le","la","les","l","un","une","des","the","a","an"];

let joueurs=[], scores=[], joueurActuel=0;
let filmsJoues=[], timeLeft, timerInt;
let selectedLetter="", selectedGenre="", modeLettreAleatoire=false;

const mode = document.getElementById("mode");
const letter = document.getElementById("letter");
const genre = document.getElementById("genre");
const multiConfig = document.getElementById("multiConfig");
const nbJoueurs = document.getElementById("nbJoueurs");
const pseudos = document.getElementById("pseudos");
const filmsDiv = document.getElementById("films");
const turn = document.getElementById("turn");
const timer = document.getElementById("timer");
const scoresDiv = document.getElementById("scores");
const inputFilm = document.getElementById("inputFilm");
const activeLetterDiv = document.getElementById("activeLetter");
const startBtn = document.getElementById("startBtn");
const validateBtn = document.getElementById("validateBtn");

/* Utils */
function normalize(t){return t.toLowerCase().replace(/['’]/g,"").replace(/[^a-z0-9]/g,"").trim();}
function stripDeterminant(t){let w=t.toLowerCase().trim();for(let d of determinants){if(w.startsWith(d+" ")) return w.slice(d.length+1); if(w.startsWith(d+"'")) return w.slice(d.length+1);} return w;}

/* Init letters */
for(let i=65;i<=90;i++){let o=document.createElement("option"); o.value=o.textContent=String.fromCharCode(i); letter.appendChild(o);}

/* Load genres */
async function chargerGenres(){
  const res = await fetch(`https://api.themoviedb.org/3/genre/movie/list?api_key=${tmdbKey}&language=fr-FR`);
  const data = await res.json();
  data.genres.forEach(g=>{
    let o = document.createElement("option");
    o.value = g.id;
    o.textContent = g.name;
    genre.appendChild(o);
  });
}
chargerGenres();

/* Multi UI */
mode.addEventListener("change", ()=>{multiConfig.style.display = mode.value==="multi"?"block":"none";});
nbJoueurs.addEventListener("change", updatePseudos);
function updatePseudos(){
  pseudos.innerHTML="";
  for(let i=0;i<nbJoueurs.value;i++){pseudos.innerHTML+=`<input id="p${i}" placeholder="Joueur ${i+1}">`;}
}
updatePseudos();

/* Random letter */
function pickRandomLetter(){
  selectedLetter = String.fromCharCode(65 + Math.floor(Math.random()*26));
  activeLetterDiv.textContent = "Lettre actuelle : " + selectedLetter;
}

/* Timer */
function startTimer(){
  clearInterval(timerInt);
  timeLeft = parseInt(document.getElementById("time").value)*60;
  timerInt = setInterval(()=>{
    timeLeft--;
    timer.textContent = "⏱️ "+timeLeft+"s";
    if(timeLeft<=0){
      clearInterval(timerInt);
      alert("Fin de la partie\n"+joueurs.map((j,i)=>`${j}: ${scores[i]}`).join("\n"));
    }
  },1000);
}

/* Update UI */
function updateUI(){
  turn.innerHTML = "Tour de : <span class='joueurActif'>"+joueurs[joueurActuel]+"</span>";
  scoresDiv.textContent = joueurs.map((j,i)=>`${j} : ${scores[i]}`).join(" | ");
}

/* Start game */
function startGame(){
  filmsJoues=[]; joueurs=[]; scores=[]; joueurActuel=0; filmsDiv.innerHTML="";
  selectedLetter = letter.value;
  modeLettreAleatoire = (letter.value==="random");
  selectedGenre = genre.value;

  if(mode.value==="multi"){
    for(let i=0;i<nbJoueurs.value;i++){
      joueurs.push(document.getElementById("p"+i).value||`Joueur ${i+1}`);
      scores.push(0);
    }
  } else { joueurs=["Joueur"]; scores=[0]; }

  if(modeLettreAleatoire) pickRandomLetter();
  updateUI();
  startTimer();
  document.getElementById("game").style.display="block";
}

/* Validate film */
async function validerFilm(){
  let input = inputFilm.value.trim(); if(!input) return;
  let clean = normalize(stripDeterminant(input));
  if(filmsJoues.includes(clean)){alert("Déjà utilisé !"); return;}

  const resFR = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${tmdbKey}&query=${encodeURIComponent(input)}&language=fr-FR`);
  const dataFR = await resFR.json();
  const resEN = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${tmdbKey}&query=${encodeURIComponent(input)}&language=en-US`);
  const dataEN = await resEN.json();

  let film = [...dataFR.results, ...dataEN.results]?.find(f=>{
    let t1=normalize(stripDeterminant(f.title||""));
    let t2=normalize(stripDeterminant(f.original_title||""));
    return clean===t1||clean===t2;
  });
  if(!film){alert("Film introuvable"); return;}

  /* Genre check */
  if(selectedGenre){
    const d = await fetch(`https://api.themoviedb.org/3/movie/${film.id}?api_key=${tmdbKey}&language=fr-FR`);
    const det = await d.json();
    if(!det.genres.map(g=>g.id).includes(parseInt(selectedGenre))){alert("Mauvais genre"); return;}
  }

  /* Letter check */
  let base = stripDeterminant(film.title||film.original_title);
  if(selectedLetter && base[0].toUpperCase()!==selectedLetter){alert("Mauvaise lettre"); return;}

  /* Add film */
  filmsJoues.push(clean);
  scores[joueurActuel]++;
  const card = document.createElement("div");
  card.className="film-card new";
  const imgUrl = film.poster_path?`https://image.tmdb.org/t/p/w200${film.poster_path}`:"";
  card.innerHTML = `${imgUrl?`<img src="${imgUrl}">`:''}<h4>${film.title}</h4>`;
  filmsDiv.prepend(card);
  setTimeout(()=>card.classList.remove("new"),300);
  inputFilm.value="";

  /* Next turn */
  joueurActuel = (joueurActuel + 1) % joueurs.length;
  if(modeLettreAleatoire) pickRandomLetter();
  updateUI();
}

startBtn.addEventListener("click", startGame);
validateBtn.addEventListener("click", validerFilm);

});
</script>

</body>
</html>
