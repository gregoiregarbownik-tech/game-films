<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>🎬 Jeu des Films</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #1a1a2e, #162447);
  color: #fff;
  text-align: center;
  margin: 0;
  padding: 20px;
}
h1 { color: #ffcc00; }
input, button, select {
  padding: 10px;
  margin: 5px;
  font-size: 16px;
  border-radius: 8px;
  border: none;
}
button {
  background: #ffcc00;
  font-weight: 600;
  cursor: pointer;
}
button:hover { background: #e6b800; }
#scoreBox, #bestScoreBox {
  display: inline-block;
  background: #222;
  padding: 10px 20px;
  border-radius: 10px;
  margin: 10px;
}
#filmGrid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 15px;
  margin-top: 20px;
}
.filmCard {
  background: #222;
  border-radius: 10px;
  padding: 5px;
}
.filmCard img {
  width: 100px;
  height: 150px;
  border-radius: 6px;
}
</style>
</head>

<body>

<h1>🎬 Jeu des Films</h1>

<div>
  ⏱ Durée (minutes) :
  <input type="number" id="timerInput" value="60" min="1" max="180">
  🔤 Mode :
  <select id="lettreInput">
    <option value="">Tous les films</option>
  </select>
  <button onclick="demarrerJeu()">Démarrer</button>
</div>

<div>
  <input type="text" id="filmInput" placeholder="Titre exact du film" disabled>
  <button onclick="validerFilm()" disabled>Valider</button>
</div>

<div id="scoreBox">Score : <span id="score">0</span></div>
<div id="bestScoreBox">Meilleur score : <span id="bestScore">0</span></div>

<p>⏳ Temps restant : <span id="temps">--:--:--</span></p>
<button onclick="pauseTimer()">⏸ Pause</button>
<button onclick="reprendreTimer()">▶️ Reprendre</button>

<div id="filmGrid"></div>

<script>
// ===== LETTRES A-Z =====
const select = document.getElementById("lettreInput");
for (let i = 65; i <= 90; i++) {
  const l = String.fromCharCode(i);
  const opt = document.createElement("option");
  opt.value = l.toLowerCase();
  opt.textContent = `Films commençant par ${l}`;
  select.appendChild(opt);
}

// ===== VARIABLES =====
let score = 0;
let bestScore = parseInt(localStorage.getItem("bestScore")) || 0;
let filmsTrouves = [];
let temps = 0;
let timer = null;

document.getElementById("bestScore").textContent = bestScore;

// ===== CLÉS API =====
const tmdbKey = "00f966a09a2db9feeb0ceedc1c33e89d";
const omdbKey = "10a96ebb";

// ===== UTILS =====
function normaliser(txt) {
  return txt.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
}

function titreSansDeterminant(titre) {
  return titre
    .toLowerCase()
    .replace(/^(l['’]|le |la |les |un |une |the )/i, "")
    .trim();
}

// ===== JEU =====
function demarrerJeu() {
  score = 0;
  filmsTrouves = [];
  temps = document.getElementById("timerInput").value * 60;
  document.getElementById("score").textContent = score;
  document.getElementById("filmGrid").innerHTML = "";
  document.getElementById("filmInput").disabled = false;
  document.querySelector("button[onclick='validerFilm()']").disabled = false;
  if (timer) clearInterval(timer);
  timer = setInterval(updateTimer, 1000);
  updateTimer();
}

function updateTimer() {
  if (temps <= 0) {
    clearInterval(timer);
    alert("⏰ Temps écoulé ! Score : " + score);
    return;
  }
  let h = Math.floor(temps / 3600);
  let m = Math.floor((temps % 3600) / 60);
  let s = temps % 60;
  document.getElementById("temps").textContent =
    `${h.toString().padStart(2, "0")}:${m.toString().padStart(2, "0")}:${s.toString().padStart(2, "0")}`;
  temps--;
}

function pauseTimer() {
  if (timer) clearInterval(timer);
  timer = null;
}

function reprendreTimer() {
  if (!timer && temps > 0) timer = setInterval(updateTimer, 1000);
}

async function validerFilm() {
  const input = document.getElementById("filmInput");
  const titre = input.value.trim();
  if (!titre) return;

  const titreNorm = normaliser(titre);
  if (filmsTrouves.includes(titreNorm)) {
    alert("Film déjà trouvé !");
    return;
  }

  const lettre = document.getElementById("lettreInput").value;

  // TMDB
  const res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${tmdbKey}&query=${encodeURIComponent(titre)}&language=fr-FR`);
  const data = await res.json();

  let film = data.results?.find(f => normaliser(f.title) === titreNorm);

  // OMDB fallback
  if (!film) {
    const res2 = await fetch(`https://www.omdbapi.com/?t=${encodeURIComponent(titre)}&apikey=${omdbKey}`);
    const data2 = await res2.json();
    if (data2.Response === "True" && normaliser(data2.Title) === titreNorm) {
      film = { title: data2.Title, poster_path: data2.Poster };
    }
  }

  if (!film) {
    alert("❌ Titre exact requis !");
    return;
  }

  const titreNettoye = titreSansDeterminant(film.title);
  if (lettre && !titreNettoye.startsWith(lettre)) {
    alert("❌ Mauvaise lettre");
    return;
  }

  filmsTrouves.push(titreNorm);
  score++;
  document.getElementById("score").textContent = score;

  if (score > bestScore) {
    bestScore = score;
    localStorage.setItem("bestScore", bestScore);
    document.getElementById("bestScore").textContent = bestScore;
  }

  const card = document.createElement("div");
  card.className = "filmCard";
  const img = document.createElement("img");
  img.src = film.poster_path?.startsWith("http")
    ? film.poster_path
    : `https://image.tmdb.org/t/p/w200${film.poster_path}`;
  card.appendChild(img);
  card.appendChild(document.createTextNode(film.title));

  document.getElementById("filmGrid").prepend(card);
  input.value = "";
}

document.getElementById("filmInput").addEventListener("keydown", e => {
  if (e.key === "Enter") validerFilm();
});
</script>

</body>
</html>
